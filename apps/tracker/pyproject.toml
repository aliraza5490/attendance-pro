[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attendance-tracker"
version = "0.1.0"
description = "Real-Time Face & Gesture Recognition Attendance Tracker"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.8.0,<5.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
tracker = "main:main"
capture = "capture:main"
train = "train:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
