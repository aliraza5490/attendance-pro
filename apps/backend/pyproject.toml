[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attendance-backend"
version = "0.1.0"
description = "FastAPI Backend for Attendance System Dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.scripts]
dev = "app.main:start"

[tool.hatch.build.targets.wheel]
packages = ["app"]
