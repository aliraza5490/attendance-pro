[project]
name = "attendance-workspace"
version = "0.1.0"
description = "Monorepo workspace for Attendance System and Dashboard"
requires-python = ">=3.11"
dependencies = [
    "attendance-tracker",
    "attendance-backend",
]

[tool.uv.sources]
attendance-tracker = { workspace = true }
attendance-backend = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/*"
]
